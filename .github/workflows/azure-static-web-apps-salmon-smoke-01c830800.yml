name: Azure Web App CI/CD

on:
  push:
    branches:
      - 29072026_latest_code
    paths:
      - 'MonetizeMate-Frontend/**'
      - '.github/workflows/azure-static-web-apps-salmon-smoke-01c830800.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MonetizeMate-Frontend/package-lock.json

      - name: Install Dependencies
        working-directory: MonetizeMate-Frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build Next App
        working-directory: MonetizeMate-Frontend
        env:
          FASTAPI_BASE_URL: ${{ secrets.FASTAPI_BASE_URL }}
          FASTAPI_URL: ${{ secrets.FASTAPI_BASE_URL }}
          NEXT_PUBLIC_API_TIMEOUT: "60000"
          NEXT_PUBLIC_AUTH_TOKEN_KEY: "auth_token"
          NEXT_PUBLIC_APP_NAME: "MonetizeMate"
        run: npm run build

      - name: Prepare Standalone Artifact
        working-directory: MonetizeMate-Frontend
        run: |
          rm -rf deploy
          mkdir -p deploy/.next
          cp -R .next/standalone/. deploy/
          cp -R .next/static deploy/.next/static
          if [ -d public ]; then cp -R public deploy/public; fi
          cat > deploy/.deployment <<'DEPLOY'
          [config]
          SCM_DO_BUILD_DURING_DEPLOYMENT=false
          DEPLOY
          cat > deploy/package.json <<'JSON'
          {
            "name": "monetize-mate-webapp",
            "private": true,
            "scripts": {
              "start": "node server.js"
            },
            "engines": {
              "node": "22.x"
            }
          }
          JSON

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "Monetizemate"
          slot-name: "production"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: MonetizeMate-Frontend/deploy


