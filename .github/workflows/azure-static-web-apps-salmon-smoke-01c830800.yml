name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - 12052026_Lastest_code
    paths:
      - 'MonetizeMate-Frontend/**'
      - '.github/workflows/azure-static-web-apps-salmon-smoke-01c830800.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: MonetizeMate-Frontend
        run: npm install --legacy-peer-deps

      - name: Build Next App
        working-directory: MonetizeMate-Frontend
        env:
          FASTAPI_BASE_URL: ${{ secrets.FASTAPI_BASE_URL }}
          FASTAPI_URL: ${{ secrets.FASTAPI_BASE_URL }}
          NEXT_PUBLIC_API_TIMEOUT: "60000"
          NEXT_PUBLIC_AUTH_TOKEN_KEY: "auth_token"
          NEXT_PUBLIC_APP_NAME: "MonetizeMate"
        run: npm run build

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_SMOKE_01C830800 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "MonetizeMate-Frontend"
          output_location: ".next"