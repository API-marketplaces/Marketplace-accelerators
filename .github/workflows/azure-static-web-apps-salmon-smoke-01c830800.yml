name: Azure Web App CI/CD

on:
  push:
    branches:
      - 19052026_latest_code
    paths:
      - 'MonetizeMate-Frontend/**'
      - '.github/workflows/azure-webapp-monetizemate.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: MonetizeMate-Frontend
        run: npm install --legacy-peer-deps

      - name: Build Next App
        working-directory: MonetizeMate-Frontend
        env:
          FASTAPI_BASE_URL: ${{ secrets.FASTAPI_BASE_URL }}
          FASTAPI_URL: ${{ secrets.FASTAPI_BASE_URL }}
          NEXT_PUBLIC_API_TIMEOUT: "60000"
          NEXT_PUBLIC_AUTH_TOKEN_KEY: "auth_token"
          NEXT_PUBLIC_APP_NAME: "MonetizeMate"
        run: npm run build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "Monetizemate"
          slot-name: "production"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: MonetizeMate-Frontend