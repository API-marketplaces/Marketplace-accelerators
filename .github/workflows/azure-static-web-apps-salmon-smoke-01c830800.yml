name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - 12052026_Lastest_code

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: MonetizeMate-Frontend
        run: npm install --legacy-peer-deps

      - name: Build Next App
        working-directory: MonetizeMate-Frontend
        run: npm run build

      - name: Export Next App
        working-directory: MonetizeMate-Frontend
        run: npx next export

      - name: Deploy to Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_SMOKE_01C830800 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "MonetizeMate-Frontend"
          output_location: "out"
