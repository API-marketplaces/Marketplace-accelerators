name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - 12052026_Lastest_code
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - 12052026_Lastest_code

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: MonetizeMate-Frontend
        run: npm install --legacy-peer-deps

      - name: Create .env file
        working-directory: MonetizeMate-Frontend
        run: |
          echo "FASTAPI_BASE_URL=${{ secrets.FASTAPI_BASE_URL }}" >> .env.local
          echo "NEXT_PUBLIC_API_TIMEOUT=30000" >> .env.local
          echo "FASTAPI_URL=${{ secrets.FASTAPI_BASE_URL }}" >> .env.local
          echo "NEXT_PUBLIC_AUTH_TOKEN_KEY=auth_token" >> .env.local
          echo "NEXT_PUBLIC_APP_NAME=MonetizeMate" >> .env.local
          echo "COOKIE=session" >> .env.local
          echo "REFRESH_COOKIE=refresh_token" >> .env.local
          echo "MAX_AGE=86400" >> .env.local

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_SMOKE_01C830800 }}
repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "out"
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_SMOKE_01C830800 }}
repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "close"
